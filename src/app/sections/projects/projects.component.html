<section class="projects">

    <h2 class="title-section">My projects</h2>

    <div class="projects-content">
        @for (project of projects; track project; let i = $index) {
            @if (i % 2 !== 0) {
                <app-card-project [project]="project" class="masonry"/>
            }
            @else {
                <app-card-project [project]="project" class="no-masonry"/>
            }
        }
    </div>

</section>
